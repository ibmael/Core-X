<button
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick.emit($event)"
  [ngClass]="bgClass"
  class="w-full rounded-[0px] font-[500] text-[14px] font-geist flex justify-center items-center gap-2 transition-all duration-200 cursor-pointer shadow-sm p-3 text-white disabled:opacity-50 disabled:cursor-not-allowed"
>
  @if (loading) {
    <span
      class="animate-spin border-2 border-white border-t-transparent rounded-full w-4 h-4"
    ></span>
  }
  {{ label }}
</button>
