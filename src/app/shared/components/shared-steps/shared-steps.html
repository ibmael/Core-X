<div class="shared-steps flex items-center w-full select-none" aria-hidden="true">
  @for (index of stepsArray; track index; let last = $last) {
    <div class="shared-steps__marker shrink-0 flex items-center justify-center">
      @if (index <= currentStep) {
        <span class="shared-steps__diamond shared-steps__diamond--filled"></span>
      } @else {
        <span class="shared-steps__diamond shared-steps__diamond--outlined"></span>
      }
    </div>

    @if (!last) {
      <div class="shared-steps__line flex-1"></div>
    }
  }
</div>
