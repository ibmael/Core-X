<div class="flex flex-col gap-2 w-full">
  <label [for]="id" class="text-[16px] font-[500] text-slate-700 font-geist">
    {{ label }}
  </label>

  <input
    pInputText
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    [formControl]="control"
    class="w-full p-4 border border-slate-300 rounded-[0px]! focus:border-primary! focus:ring-1 focus:ring-primary! outline-hidden"
  />
</div>
