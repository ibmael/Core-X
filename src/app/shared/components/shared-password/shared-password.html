<div class="flex flex-col gap-2 w-full max-w-full">
  <label [for]="id" class="text-[16px] font-[500] text-[#1f2937] font-geist">
    {{ label }}
  </label>

  <div class="relative w-full max-w-full">
    <input
      [id]="id"
      [type]="showPassword ? 'text' : 'password'"
      [placeholder]="placeholder"
      [attr.aria-invalid]="hasError"
      [attr.size]="null"
      [class]="
        'auth-input h-12 px-4 pr-12 border outline-hidden font-geist text-[14px] placeholder:text-[#c0c6d0] bg-white transition-colors ' +
        (hasError
          ? 'border-[#f87171] focus:border-[#f87171] focus:ring-1 focus:ring-[#fca5a5]'
          : 'border-[#d1d5db] focus:border-primary focus:ring-1 focus:ring-primary')
      "
    />

    <button
      type="button"
      (click)="toggleVisibility()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 cursor-pointer p-1"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
    >
      @if (showPassword) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10.7 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16.8 16.8 0 0 1-3.3 4.3" />
          <path d="M6.6 6.6A16.6 16.6 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 5.4-1.5" />
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          <path d="M2 2l20 20" />
        </svg>
      }
    </button>
  </div>

  @if (hasError && errorMessage) {
    <p class="text-[13px] text-[#ef4444] font-geist leading-tight">{{ errorMessage }}</p>
  }
</div>
