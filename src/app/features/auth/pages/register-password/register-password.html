<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form flex flex-col gap-6">
    <app-shared-steps [totalSteps]="4" [currentStep]="3" />

    <app-auth-header title="Create Account" subtitle="Create a strong password" />

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <app-shared-password
        id="password"
        label="Password"
        formControlName="password"
        [hasError]="!!(passwordControl?.touched && passwordControl?.invalid)"
        [errorMessage]="
          passwordControl?.hasError('required')
            ? 'Your password is required'
            : 'Password must be at least 8 chars, contain an uppercase letter, number, & special char'
        "
      />

      <app-shared-password
        id="confirmPassword"
        label="Confirm Password"
        formControlName="confirmPassword"
        [hasError]="!!(confirmPasswordControl?.touched && confirmPasswordControl?.invalid)"
        [errorMessage]="
          confirmPasswordControl?.hasError('required')
            ? 'Please confirm your password'
            : 'Passwords do not match'
        "
      />

      <app-auth-error-banner [message]="errorMessage" />

      <app-shared-button
        label="Create Account"
        type="submit"
        [loading]="loading"
        [disabled]="loading"
        class="mt-2"
      />
    </form>
  </div>
</div>
