<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form flex flex-col gap-7">
    <div class="flex flex-col gap-2">
      <h1 class="text-[26px] sm:text-[32px] font-[700] text-[#111827]">Create a New Password</h1>
      <p class="text-[14px] sm:text-[15px] text-slate-500 font-geist max-w-[430px]">
        Create a new strong password for your account.
      </p>
    </div>

    <form [formGroup]="newPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <app-shared-password
        id="password"
        label="New Password"
        formControlName="newPassword"
        [hasError]="!!(newPasswordControl?.touched && newPasswordControl?.invalid)"
        [errorMessage]="
          newPasswordControl?.hasError('required')
            ? 'Your password is required'
            : 'Password must be at least 8 chars, contain an uppercase letter, number, & special char'
        "
      />

      <app-shared-password
        id="confirmPassword"
        label="Confirm New Password"
        formControlName="confirmPassword"
        [hasError]="!!(confirmPasswordControl?.touched && confirmPasswordControl?.invalid)"
        [errorMessage]="
          confirmPasswordControl?.hasError('required')
            ? 'Please confirm your password'
            : 'Passwords do not match'
        "
      />

      <app-auth-error-banner [message]="errorMessage" />

      <app-shared-button
        label="Reset Password"
        type="submit"
        [loading]="loading"
        [disabled]="loading"
        class="mt-2"
      />
    </form>

    <p class="text-[14px] text-slate-500 font-geist text-center">
      Don't have an account?
      <a routerLink="/auth/register" class="text-primary font-[600] hover:underline ml-1">
        Create yours
      </a>
    </p>
  </div>
</div>
