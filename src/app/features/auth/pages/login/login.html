<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form w-full max-w-[420px] flex flex-col gap-6">
    <app-auth-header title="Login" />

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="flex flex-col gap-4">
      <app-shared-input
        id="username"
        label="Username"
        placeholder="user123"
        type="text"
        formControlName="username"
        [hasError]="!!(usernameControl?.touched && usernameControl?.invalid)"
        errorMessage="Your username is required"
      />

      <app-shared-password
        id="password"
        label="Password"
        placeholder="********"
        formControlName="password"
        [hasError]="!!(passwordControl?.touched && passwordControl?.invalid)"
        errorMessage="Your password is required"
      />

      <div class="text-right">
        <a
          routerLink="/auth/forget-password"
          class="text-[14px] text-primary hover:underline font-[500] cursor-pointer font-geist"
        >
          Forgot your password?
        </a>
      </div>

      <app-auth-error-banner [message]="errorMessage" />

      <app-shared-button label="Login" type="submit" [loading]="loading" [disabled]="loading" />

      <app-auth-footer-link
        message="Don't have an account?"
        actionText="Create yours"
        link="/auth/register"
      />
    </form>
  </div>
</div>
