<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form w-full max-w-[420px] flex flex-col gap-6">
    <app-auth-header title="Create Account" />

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <app-shared-input
        id="email"
        label="Email"
        placeholder="user@example.com"
        type="email"
        formControlName="email"
        [hasError]="!!(emailControl?.touched && emailControl?.invalid)"
        errorMessage="Your email is required and must be valid"
      />

      <app-auth-error-banner [message]="errorMessage" />

      <app-shared-button
        label="Next >"
        type="submit"
        [loading]="loading"
        [disabled]="loading"
        bgClass="bg-[#EFF6FF]! text-primary! border border-[#BFDBFE]! hover:bg-[#DBEAFE]!"
      />

      <app-auth-footer-link
        message="Already have an account?"
        actionText="Login"
        link="/auth/login"
      />
    </form>
  </div>
</div>
