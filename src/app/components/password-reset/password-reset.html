<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form flex flex-col gap-6">
    <div class="flex">
      <a
        routerLink="/auth/forget-password"
        class="flex items-center justify-center w-10 h-10 border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors cursor-pointer select-none"
        aria-label="Back to forgot password"
      >
        <span class="text-[18px]">←</span>
      </a>
    </div>

    <div class="flex flex-col gap-4">
      <h2 class="text-[26px] sm:text-[28px] font-[700] text-slate-800">Password Reset Sent</h2>

      <div class="flex flex-col gap-4 font-geist text-[14px] leading-relaxed">
        <p class="text-slate-500">
          We have sent a password reset link to: <br />
          <span class="text-primary font-[500]">user&#64;example.com.</span>
        </p>

        <p class="text-slate-500">
          Please check your inbox and follow the instructions to reset your password.
        </p>

        <p class="text-slate-400 text-[13px]">
          If you don't see the email within a few minutes, check your spam or junk folder.
        </p>
      </div>
    </div>

    <div class="mt-4">
      <p class="text-[14px] text-slate-500 font-geist">
        Don't have an account?
        <a
          routerLink="/auth/register"
          class="text-primary font-[600] hover:underline ml-1 cursor-pointer"
        >
          Create yours
        </a>
      </p>
    </div>
  </div>
</div>
