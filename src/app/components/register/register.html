<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form w-full max-w-[420px] flex flex-col gap-6">
    <app-auth-header title="Create Account" />

    <div class="flex flex-col gap-4">
      <app-shared-input
        id="email"
        label="Email"
        placeholder="user@example.com"
        type="email"
        [hasError]="true"
        errorMessage="Your email is required"
      />

      <app-auth-error-banner />

      <a routerLink="/auth/otp" class="block w-full">
        <app-shared-button
          label="Next >"
          type="button"
          bgClass="bg-[#EFF6FF]! text-primary! border border-[#BFDBFE]! hover:bg-[#DBEAFE]!"
        />
      </a>

      <app-auth-footer-link
        message="Already have an account?"
        actionText="Login"
        link="/auth/login"
      />
    </div>
  </div>
</div>
