<div class="flex items-center w-full min-h-screen justify-center bg-white p-6 sm:p-8 lg:p-12">
  <div class="auth-form flex flex-col gap-6">
    <app-shared-steps [totalSteps]="4" [currentStep]="3" />

    <app-auth-header title="Create Account" subtitle="Create a strong password" />

    <div class="flex flex-col gap-5">
      <app-shared-password
        id="password"
        label="Password"
        [hasError]="true"
        errorMessage="Your password is required"
      />

      <app-shared-password
        id="confirmPassword"
        label="Confirm Password"
        [hasError]="true"
        errorMessage="Please confirm your password"
      />

      <app-auth-error-banner />

      <a routerLink="/auth/login" class="block w-full mt-2">
        <app-shared-button label="Create Account" type="button" />
      </a>
    </div>
  </div>
</div>
