<section class="min-h-screen flex w-full">
  <div class="flex items-center min-h-screen justify-center bg-white">
    <div class="w-full max-w-sm flex flex-col gap-6">
      <h2 class="text-[30px] font-[700] text-[#1F2937] mb-2">Login</h2>

      <form class="flex flex-col gap-3">
        <div class="flex flex-col gap-2">
          <label for="username" class="text-[16px] font-[500] text-slate-700 font-geist"
            >Username</label
          >
          <input
            pInputText
            id="username"
            name="username"
            [(ngModel)]="usernameValue"
            placeholder="user123"
            class="w-full p-3 border border-slate-300 rounded-[0px]! focus:border-primary! focus:ring-1 focus:ring-primary! outline-hidden"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="password" class="text-[16px] font-[500] text-slate-700 font-geist"
            >Password</label
          >
          <p-password
            id="password"
            name="password"
            [(ngModel)]="passwordValue"
            [toggleMask]="true"
            [feedback]="false"
            placeholder="********"
            styleClass="w-full"
            inputStyleClass="w-full p-3 border border-slate-300 rounded-[0px]! focus:border-primary! focus:ring-1 focus:ring-primary! outline-hidden"
          ></p-password>
        </div>

        <div class="text-right">
          <a href="#" class="text-[14px] text-primary hover:underline font-[500] font-geist">
            Forgot your password?
          </a>
        </div>

        <button
          pButton
          type="submit"
          label="Login"
          class="w-full rounded-[0px]! bg-primary! hover:bg-blue-700 font-[500]! text-[14px]! font-geist! justify-center transition-all duration-200 cursor-pointer shadow-sm"
        >
          Login
        </button>

        <p class="text-[14px] text-center font-geist text-[#6b7280] font-medium mt-2">
          Don't have an account?
          <a href="#" class="text-primary text-[14px] font-geist font-semibold hover:underline"
            >Create yours</a
          >
        </p>
      </form>
    </div>
  </div>
</section>
