<div class="flex items-center w-full min-h-screen justify-center bg-white p-8 lg:p-12">
  <div class="w-full max-w-[500px]! flex flex-col gap-6">
    <app-auth-header title="Login" />

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <app-shared-input
          id="username"
          class="font-geist"
          label="Username"
          placeholder="user123"
          type="text"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-[16px] font-[500] text-slate-700 font-geist"
          >Password</label
        >
        <p-password
          id="password"
          name="password"
          [(ngModel)]="passwordValue"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="********"
          [style]="{ width: '100%' }"
          styleClass="w-full"
          inputStyleClass="w-full p-4 border border-slate-300 rounded-[0px]! focus:border-primary! focus:ring-1 focus:ring-primary! outline-hidden"
        />
      </div>

      <div class="text-right">
        <a
          routerLink="/auth/forget-password"
          class="text-[14px] text-primary hover:underline font-[500] cursor-pointer font-geist"
        >
          Forgot your password?
        </a>
      </div>

      <app-shared-button label="Login" [loading]="isLoading"> </app-shared-button>

      <app-auth-footer-link
        message="Don't have an account?"
        actionText="Create yours"
        link="/auth/register"
      />
    </form>
  </div>
</div>
